ma_golden_cross:
  matched: ["MA金叉", "均线粘合突破", "MACD金叉放量"]
  returns: [-45.24, -25.79, -46.57]
  sample_sizes: [131, 139, 132]
  verdict: strongly_negative
  note: |
    样本/收益取 prod 面板复跑权威（见 _meta ma 旁注）：证据窗
    2026-06-24 ~ 2026-10-08（扩窗，右端仍 2026-10-08）。
    「MA金叉」-45.24%（131 笔）、「均线粘合突破」-25.79%（139 笔）、
    「MACD金叉放量」-46.57%（132 笔）。三腿全负，最低样本 131 笔 ≥ 100 → 样本闸通过。
    旧值 [59,113,76] / [-14.70,-16.37,1.16]（含「MACD金叉放量」+1.16% 的「唯一例外」）
    系旧窗产物，已被面板新权威取代；本轮 verdict 由 negative 升为 strongly_negative。
    整体看：单纯依赖均线交叉形态，无差别执行是强负期望，无一腿为正。
  guidance: |
    1. 金叉信号本身不构成买入理由，必须叠加第二重确认（题材共振 / 板块效应 / 基本面拐点）。
    2. 深度下跌中的金叉尤其危险 —— 机械执行下这类信号占比高且贡献主要亏损。
    3. 若只能给出"金叉 + 放量"这类单一理由，应降低评分或观望。

shrink_pullback:
  matched: ["缩量回踩", "均线回踩反弹", "RSI中轴回踩"]
  returns: [-38.11, -36.47, -29.89]
  sample_sizes: [210, 229, 166]
  verdict: negative
  note: |
    20261104 tip/prod 面板复跑（symbols=null，#270 费率；源 zip d1a98a21… /
    REVIEW b26f02c0…）：「缩量回踩」-38.11%（210 笔），「均线回踩反弹」
    -36.47%（229 笔），「RSI中轴回踩」-29.89%（166 笔）。166 ≠ 旧读数 94；
    本版接受面板为新权威，旧 [127,171,94] / 旧 returns 是历史「24 策略全量
    回测报告」粘贴，不据此改参凑数。同窗 2026-07-08 ~ 2026-10-08 弱势下行，
    三项样本均 ≥166，结论仍为负期望。
  guidance: |
    1. 回踩买入的前提是**原趋势成立**。在弱势下行市场里"回踩"往往不是回踩而是趋势破位，
       机械执行亏在这里。
    2. 必须验证大级别趋势方向：只在明确的上升通道里采信回踩信号。
    3. 缩量是必要非充分条件 —— 缩量只说明抛压减弱，不说明有买盘接。

