# =============================================================================
# 量化回测证据库 —— TSP 全市场机械回测 → DSA 策略提示
#
# 来源: Tick Stock Panel 内置 24 策略全量回测, 数据区间 2026-07-08 ~ 2026-10-08
#       (61 个交易日), 全市场 5882 只, 次日开盘建仓 / 信号日收盘清仓 /
#       等权 10 仓 / 佣金 0.02% + 滑点 5bp。同期基准(上证) -4.00%。
#       详见 TSP 内置策略全量回测报告 (2026-10-08)
#
# 为什么单独成文件、不写进 strategies/*.yaml:
#   strategies/ 目录会被全量 glob 当作策略加载, 塞进去会被误识别成一个"策略"。
#   且证据是跨策略的横向事实, 集中管理更好维护。
#
# 【口径差异 —— 使用时必须知道】
#   TSP 是"机械执行": 打分选前 N 只 → 次日开盘无脑买入 → 等权持有 → 到点卖。
#   DSA 是"主观精选": LLM 结合题材/基本面/盘口做二次筛选, 且会择时。
#   所以 TSP 的负收益 ≠ DSA 该策略无效, 而是说明:
#   **这类形态在无差别执行下是负期望, DSA 的超额必须来自"精选"本身。**
#   换句话说: 负收益是 DSA 要跑赢的基准线, 不是禁用令。
# =============================================================================

_meta:
  source: "TSP 内置策略全量回测"
  report: "TSP 内置 24 策略全量回测报告 (2026-10-08)"
  period: "2026-07-08 ~ 2026-10-08"
  universe: 5882
  benchmark_return: "-4.00%"
  updated: "2026-10-08"

ma_golden_cross:
  matched: ["MA金叉", "均线粘合突破", "MACD金叉放量"]
  returns: [-14.70, -16.37, 1.16]
  sample_sizes: [59, 113, 76]
  verdict: negative
  note: |
    同名策略「MA金叉」-14.70%（59 笔，夏普 -2.14），强相关的「均线粘合突破」-16.37%
    （113 笔）。唯一的例外「MACD金叉放量」+1.16%（76 笔），但幅度仅略高于基准。
    整体看：单纯依赖均线交叉形态，无差别执行是负期望。
  guidance: |
    1. 金叉信号本身不构成买入理由，必须叠加第二重确认（题材共振 / 板块效应 / 基本面拐点）。
    2. 深度下跌中的金叉尤其危险 —— 机械执行下这类信号占比高且贡献主要亏损。
    3. 若只能给出"金叉 + 放量"这类单一理由，应降低评分或观望。

shrink_pullback:
  matched: ["缩量回踩", "均线回踩反弹", "RSI中轴回踩"]
  returns: [-11.25, -18.18, -9.12]
  sample_sizes: [127, 171, 94]
  verdict: negative
  note: |
    同名策略「缩量回踩」-11.25%（127 笔）。样本量最大、最贴近本策略的
    「均线回踩反弹」-18.18%（171 笔，夏普 -3.51，是回撤最深的策略之一）。
    注意：这三个样本量在 24 个策略里都属于较高的一档（94~171），结论相对可信。
  guidance: |
    1. 回踩买入的前提是**原趋势成立**。在弱势市场里"回踩"往往不是回踩而是趋势破位，
       机械执行亏在这里。
    2. 必须验证大级别趋势方向：只在明确的上升通道里采信回踩信号。
    3. 缩量是必要非充分条件 —— 缩量只说明抛压减弱，不说明有买盘接。

volume_breakout:
  matched: ["放量创60日新高", "趋势突破", "平台整理突破", "布林突破"]
  returns: [-23.86, -32.44, -13.80, -19.81]
  sample_sizes: [78, 77, 79, 110]
  verdict: strongly_negative
  note: |
    这是回测里亏损最集中的一族：放量创60日新高 -23.86%、趋势突破 -32.44%
    （77 笔，夏普 -4.09，均笔 -5.50%）、平台整理突破 -13.80%、布林突破 -19.81%。
    四个口径全部为负，无一例外。
  guidance: |
    1. **突破类信号是本轮回测亏损最重的方向**，采信门槛应当最高。
    2. 放量突破在次日开盘买入 = 买在情绪高点，滑点与回撤都最差。若确要参与，
       考虑等回踩确认而非追突破当日。
    3. 必须区分"真突破"与"假突破"：有无板块效应、有无后续量能延续、是否大盘配合。
       没有这三项，机械突破大概率是负期望。

bull_trend:
  matched: ["均线多头", "趋势突破"]
  returns: [-29.43, -32.44]
  sample_sizes: [93, 77]
  verdict: strongly_negative
  note: |
    「均线多头」-29.43%（93 笔，夏普 -3.40）、「趋势突破」-32.44%。
    多头排列看似最安全的形态，在近 3 个月机械执行下却是最差的之一 ——
    典型的"形态成立时价格已在尾部"。
  guidance: |
    1. 多头排列是**滞后指标**：当均线完全多头时，涨幅往往已兑现大半。
    2. 本策略作为"默认个股分析优先策略"使用时，不能只报形态，必须回答
       "趋势还能走多远"—— 用板块位置、估值分位、情绪水位来回答。
    3. 注意区间背景：近 3 个月上证 -4.00%，弱势市场里趋势策略天然逆风。

dragon_head:
  matched: ["连板股", "连板接力", "涨停基因活跃股", "低波动龙头"]
  returns: [-40.92, -25.18, -9.08, -8.49]
  sample_sizes: [233, 234, 55, 73]
  verdict: strongly_negative
  note: |
    **本轮回测最惨的一族，且样本量最大**：连板股 -40.92%（233 笔，回撤 -42.07%）、
    连板接力 -25.18%（234 笔）。这两个是全部 24 个策略里样本量最大的两个，
    结论的可信度也是最高的 —— 不是小样本噪声。
    相对温和的「涨停基因活跃股」-9.08%、「低波动龙头」-8.49% 同样为负。
  guidance: |
    1. **追高位连板是回测中最确定的亏损来源**（233/234 笔的大样本，非偶然）。
       任何"打板""接力""数板"逻辑都必须极其谨慎。
    2. 龙头策略的价值应来自**板块启动早期的识别**，而非连板高度的追随。
       越晚介入，越接近回测中被惩罚的那一类。
    3. 若个股已进入高位连板区间，应主动提示风险而非给出买入评分。

bottom_volume:
  matched: ["超跌反弹", "超跌反转", "量价齐升", "高换手拉升"]
  returns: [-0.79, -9.09, -23.35, -22.99]
  sample_sizes: [77, 71, 100, 163]
  verdict: mixed
  note: |
    这一族分化明显：「超跌反弹」-0.79%（77 笔）几乎与基准持平、是 24 个策略里
    倒数第四好；但「量价齐升」-23.35%、「高换手拉升」-22.99% 显著为负。
    差别在于：单纯"跌多了反弹"尚有微弱正贡献，而"放量拉升"类则明确为负。
  guidance: |
    1. 底部放量的关键是**位置**（是否真的在底部），而非量能本身。
    2. "放量拉升"是危险信号（量价齐升 -23.35%），高位放量尤其要警惕出货。
    3. 超跌反弹类相对最不坏，但仍需第二重确认，不宜单凭此给高评分。
