# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   定时模式: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPI模式: docker-compose -f ./docker/docker-compose.yml up -d server
#   同时启动: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量（从 .env 文件加载）。不要将 ../.env 作为单文件 volume 挂载到 /app/.env，
  # 否则 Docker mount point 会阻止配置保存时的 os.replace 原子更新。
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../longbridge_tokens on the host before copying an authorized token cache into it.
    - ../longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment:
    - TZ=Asia/Shanghai

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    # API_PORT 从 .env 文件读取，无需在此硬编码

    # 代理设置（如果需要）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # 资源限制：完整分析建议 1G+；512M 仅适合轻量 Web/API、单股、低并发场景，
  # 且建议设置 MAX_WORKERS=1 并避免同时启动 analyzer 和 server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    # ── 覆盖 Dockerfile 的 HEALTHCHECK ────────────────────────────────
    # Dockerfile 里那条是给 server 写的: curl http://localhost:8000/...
    # analyzer 跑的是 `python main.py --schedule` —— 后台调度器, 不监听任何
    # HTTP 端口。所以那条检查在 analyzer 上恒为 connection refused(exit 7),
    # 实测连续 1143 次全败, 容器永远 unhealthy, 但服务其实一直在正常工作。
    # 这里改成检查主进程(PID 1)是否还是 main.py。
    # 镜像里没有 pgrep/ps(精简 Debian), 用 python 读 /proc 代替。
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import sys; sys.exit(0 if ''main.py'' in open(''/proc/1/cmdline'',''rb'').read().decode(''utf8'',''ignore'') else 1)"'
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # FastAPI 模式
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    # 若使用 network_mode: host，则以下 ports 映射无效，端口由 command 中的 --port 指定
    #
    # 宿主侧与容器侧端口分开配置，避免和宿主机上直接跑的 webui.py 抢端口：
    #   - 容器内部固定 ${API_PORT:-8000}（与上面 command 的 --port 一致）
    #   - 宿主侧默认 8001，与本机 .env 的 WEBUI_PORT=8000 错开，两者可并存
    # 容器内部必须 bind 0.0.0.0，否则宿主映射连不进去；暴露面由宿主侧这一列控制：
    #   仅本机能访问（默认）-> "127.0.0.1:${WEBUI_HOST_PORT:-8001}:${API_PORT:-8000}"
    #   同网段可访问        -> "${WEBUI_HOST_PORT:-8001}:${API_PORT:-8000}"
    # 默认只绑 127.0.0.1：局域网与公网都摸不到，外部访问走 SSH 隧道
    #   ssh -L 8001:127.0.0.1:8001 <宿主机>
    # 即便端口哪天被暴露出去，/api/v1/system/config 等 .env 写入接口也只认
    # 回环来源（见 system_config._allow_env_backup_access），不会裸奔。
    ports:
      - "127.0.0.1:${WEBUI_HOST_PORT:-8001}:${API_PORT:-8000}"
