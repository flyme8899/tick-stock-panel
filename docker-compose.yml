# Phase 0 单 service:FastAPI 启动后既跑 API 又托管前端 dist。
# 见 ADR-17 / §8.1。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.3}
    container_name: TickFlow_Stock_Panel
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3018}:3018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # 强制固定为容器内绝对路径, 防止 .env 里的 DATA_DIR=./data(开发模式用)
      # 被 env_file 原样传入容器后按错误的相对路径解析, 写到未挂载卷的目录,
      # 导致每次 up --build 重建容器都丢数据。environment 优先级高于 env_file,
      # 无论 .env 怎么写这里都以容器路径为准。
      - DATA_DIR=/app/data
      # 将主机 Codex Desktop 的 loopback local-access 端点映射到 Docker host gateway。
      - CODEX_DOCKER_HOST=host.docker.internal
      # 下面几项手工 docker run 时传过、但这份文件一直漏掉。前三个有代码默认值
      # 兜底所以没炸，补上只为让配置来源一致、换机器不用再猜。
      - TICKFLOW_ENV_FILE=/app/.env
      - TIERS_YAML=/app/tiers.yaml
      - STATIC_DIR=/app/static
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./tiers.yaml:/app/tiers.yaml:ro
      # 保留原始 dotenv 值供首次密码初始化读取，避免 Compose 展开密码中的 $VAR。
      - ./.env:/app/.env:ro
      # 复用主机 Codex 登录态；后端只读后复制到单次请求的临时 CODEX_HOME。
      # Windows PowerShell/CMD 下 HOME 常未设置, 可通过 .env 里 CODEX_HOME_HOST 覆盖。
      - ${CODEX_HOME_HOST:-${HOME}/.codex}:/root/.codex:ro
    networks:
      # 与 DSA 走同一张网，才能用 DSA_BASE_URL=http://dsa:8000 按服务名解析。
      # 用固定名字的网络、而不是 compose 那份自动命名的默认网：DSA 常常是
      # 另外单独启动的（./scripts/dsa.sh 或独立容器），默认网名字带项目前缀，
      # 外面那个容器对不上。固定名之后 `--network dsa-net` 就能加进来。
      # 名字可用 .env 的 DSA_NETWORK 覆盖。
      - dsa-net
    restart: unless-stopped

  # 可选。DSA 的 API 旁路，不托管它自己的前端。
  # 在 .env 设置 DSA_BASE_URL=http://dsa:8000 后执行:
  #   docker compose --profile dsa up --build
  dsa:
    profiles: ["dsa"]
    build:
      context: ./vendor/daily_stock_analysis
      dockerfile: Dockerfile.tsp
    container_name: TickFlow_Stock_Panel_DSA
    ports:
      - "${DSA_HOST:-127.0.0.1}:${DSA_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENV_FILE=/app/.env
      - DATABASE_PATH=/app/data/stock_analysis.db
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8000
      - TZ=Asia/Shanghai
      # 容器内路径。覆盖 .env 里可能写成的宿主机路径。设为 off 可关闭注入。
      - TSP_QUANT_EVIDENCE_FILE=/opt/tsp/quant_evidence.yaml
    volumes:
      - ./data/dsa:/app/data
      # 决策页保存定时设置时会写回这份文件。只读挂载会导致保存失败。
      - ./.env:/app/.env
      - ./backend/app/custom/dsa/dsa_bootstrap.py:/opt/tsp/dsa_bootstrap.py:ro
      - ./backend/app/custom/dsa/quant_evidence.py:/opt/tsp/quant_evidence.py:ro
      - ./backend/app/custom/dsa/quant_evidence.yaml:/opt/tsp/quant_evidence.yaml:ro
    networks:
      # 与 app 同网，app 才能用 http://dsa:8000 找到它。
      - dsa-net
    # 探针是 sidecar 自己的 /api/v1/health（免登录）。不要用恒成功的兜底命令。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    entrypoint: ["python", "/opt/tsp/dsa_bootstrap.py"]
    command: ["main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

networks:
  # 固定名字，compose 自己建。名字可用 .env 的 DSA_NETWORK 覆盖，默认 dsa-net。
  #
  # 不用 external: true，是因为那样会多一个前置条件：没先
  # docker network create 的话，裸 `docker compose up` 直接失败——哪怕不启
  # dsa profile 也一样，因为 app 就挂在这张网上。而这台机器上 dsa-net 是
  # 手工建的，换台机器就没了。让 compose 建同名网络，裸 up 能直接跑通，
  # 外面单独起的 sidecar 用 --network dsa-net 也能加进来。
  #
  # 代价是 docker compose down 会删掉这张网（已有容器连着则删不掉，只会报警告）。
  # 下次 up 会重建同名网络，上面这些容器不受影响。
  #
  # 注意：如果已有一张同名网是手工 docker network create 建的（没有 compose 标签），
  # compose 不会接管，会直接报错退出：
  #   network dsa-net was found but has incorrect label com.docker.compose.network set to "" (expected: "dsa-net")
  # 此时先 docker network rm dsa-net 再 up，让它重建。
  dsa-net:
    name: ${DSA_NETWORK:-dsa-net}
